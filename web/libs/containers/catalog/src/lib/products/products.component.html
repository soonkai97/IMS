<app-page-header [heading]="'products.title' | t">
  <div actions>
    @if ($canManage()) {
      <a class="ui-link-button" routerLink="/products/import">{{ 'products.import' | t }}</a>
      <a class="ui-link-button --primary" routerLink="/products/new">{{ 'products.new' | t }}</a>
    }
  </div>
</app-page-header>

<div class="products-page-filters">
  <app-search-input
    [(value)]="$searchInput"
    [label]="'products.searchLabel' | t"
    [placeholder]="'products.searchPlaceholder' | t"
  />
  <app-form-field [label]="'product.category' | t">
    <app-select
      [formControl]="categoryControl"
      [options]="$categoryOptions()"
      [placeholder]="'filter.all' | t"
    />
  </app-form-field>
  <app-form-field [label]="'product.status' | t">
    <app-select [formControl]="statusControl" [options]="$statusOptions()" />
  </app-form-field>
</div>

<app-table
  #table
  columnMenu
  [columns]="$columns()"
  [rows]="$page()?.items ?? []"
  [caption]="'products.title' | t"
  [loading]="$isLoading()"
  [failed]="$failed()"
  [rowLink]="rowLink"
  [sort]="$sort()"
  (sortChange)="onSortChange($event)"
  (retried)="onRetry()"
>
  <ng-template appCell="safety" let-row>{{ row.safetyStock | appQty }}</ng-template>
  <ng-template appCell="active" let-row>
    <app-status-chip
      [label]="(row.isActive ? 'product.active' : 'product.inactive') | t"
      [status]="row.isActive ? 'posted' : 'cancelled'"
    />
  </ng-template>
  <app-empty-state
    empty
    icon="tag"
    [message]="($hasFilters() ? 'products.noMatch' : 'products.empty') | t"
  >
    @if ($canManage()) {
      <a class="ui-link-button --primary" routerLink="/products/new">{{ 'products.new' | t }}</a>
    }
  </app-empty-state>
</app-table>

@if ($page(); as page) {
  <app-pager
    [table]="table"
    [pageSizes]="pageSizes"
    (pageSizeChange)="onPageSizeChange($event)"
    [page]="page.page"
    [pageSize]="page.pageSize"
    [total]="page.total"
    (pageChange)="onPageChange($event)"
  />
}
