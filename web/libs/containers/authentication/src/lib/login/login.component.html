<main class="login-page-panel">
  <h1 class="login-page-title">{{ 'app.name' | t }}</h1>
  <p class="login-page-subtitle">{{ 'app.tagline' | t }}</p>

  <form class="login-page-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    @if ($sessionExpired()) {
      <app-banner kind="warning">{{ 'login.sessionExpired' | t }}</app-banner>
    }
    <app-form-field
      [label]="'login.username' | t"
      [required]="true"
      [control]="form.controls.username"
    >
      <app-input
        formControlName="username"
        autocomplete="username"
        [maxLength]="maxUsernameLength"
      />
    </app-form-field>
    <app-form-field
      [label]="'login.password' | t"
      [required]="true"
      [control]="form.controls.password"
    >
      <app-input
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [maxLength]="maxPasswordLength"
      />
    </app-form-field>

    @if ($errorMessage(); as errorMessage) {
      <app-banner kind="danger">{{ errorMessage }}</app-banner>
    }

    <app-button type="submit" variant="primary" [block]="true" [loading]="$isRunning()">
      {{ 'login.submit' | t }}
    </app-button>
  </form>

  <app-language-select />

  @if (isDev) {
    <p class="login-page-dev-hint">{{ 'login.devHint' | t }}</p>
  }
</main>
