<app-page-header
  [heading]="'account.password.title' | t"
  [subtitle]="'account.password.subtitle' | t"
/>

<app-card>
  <form class="change-password-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <app-form-legend />
    <app-form-field
      [label]="'account.password.current' | t"
      [required]="true"
      [control]="form.controls.currentPassword"
      [messages]="{
        required: 'account.password.current.empty' | t,
        maxlength: 'validation.maxLength' | t: { length: maxLength }
      }"
    >
      <app-input
        #current
        type="password"
        formControlName="currentPassword"
        name="currentPassword"
        autocomplete="current-password"
        [noSuggestions]="true"
        [readonly]="$busy()"
        [maxLength]="maxLength"
      />
    </app-form-field>
    <app-form-field
      [label]="'account.password.new' | t"
      [required]="true"
      [hint]="'account.password.new.hint' | t: { min: minLength }"
      [control]="form.controls.newPassword"
      [messages]="{
        required: 'account.password.new.empty' | t,
        minlength: 'validation.minLength' | t: { length: minLength },
        maxlength: 'validation.maxLength' | t: { length: maxLength },
        sameAsCurrent: 'account.password.new.same' | t
      }"
    >
      <app-input
        #newPassword
        type="password"
        formControlName="newPassword"
        name="newPassword"
        autocomplete="new-password"
        [noSuggestions]="true"
        [readonly]="$busy()"
        [maxLength]="maxLength"
      />
    </app-form-field>

    @if ($banner(); as banner) {
      <app-banner [kind]="$bannerKind()" [alert]="true">{{ banner }}</app-banner>
    }

    <div class="change-password-actions">
      <app-button type="submit" variant="primary" [loading]="$busy()">{{
        'account.password.submit' | t
      }}</app-button>
      <app-button variant="secondary" [disabled]="$busy()" (clicked)="onCancel()">{{
        'common.cancel' | t
      }}</app-button>
    </div>
  </form>
</app-card>
