<app-page-header [heading]="'audit.title' | t" />

<div class="audit-log-page-filters">
  <app-search-input
    [(value)]="$searchInput"
    [label]="'audit.searchLabel' | t"
    [placeholder]="'audit.searchPlaceholder' | t"
  />
  <app-form-field [label]="'audit.action' | t">
    <app-select
      [formControl]="actionControl"
      [options]="$actionOptions()"
      [placeholder]="'filter.any' | t"
    />
  </app-form-field>
  <app-form-field [label]="'audit.actor' | t">
    <app-input [formControl]="actorControl" />
  </app-form-field>
  <app-form-field [label]="'filter.from' | t" [control]="fromControl">
    <app-date-field [formControl]="fromControl" />
  </app-form-field>
  <app-form-field [label]="'filter.to' | t" [control]="toControl" [error]="$toError()">
    <app-date-field [formControl]="toControl" />
  </app-form-field>
</div>

<app-table
  [columns]="$columns()"
  [rows]="$page()?.items ?? []"
  [caption]="'audit.title' | t"
  [loading]="$isLoading()"
  [failed]="$failed()"
  (retried)="onRetry()"
>
  <ng-template appCell="at" let-row>{{ row.at | appDate }}</ng-template>
  <ng-template appCell="details" let-row>
    <app-button
      variant="ghost"
      [ariaLabel]="
        'audit.showFor'
          | t
            : {
                action: row.action ?? '',
                entity: entityOf(row),
                when: row.at | appDate,
                number: entryNumber(row)
              }
      "
      (clicked)="onShowDetails(row)"
      >{{ 'audit.show' | t }}</app-button
    >
  </ng-template>
  <app-empty-state empty icon="audit" [message]="'audit.empty' | t">
    @if ($hasFilters()) {
      <app-button (clicked)="onClearFilters()">{{ 'filter.clear' | t }}</app-button>
    }
  </app-empty-state>
</app-table>

@if ($page(); as page) {
  <app-pager
    [page]="page.page"
    [pageSize]="page.pageSize"
    [total]="page.total"
    (pageChange)="onPageChange($event)"
  />
}

<app-dialog [(open)]="$detailOpen" [heading]="'audit.details' | t">
  <section>
    <h3>{{ 'audit.before' | t }}</h3>
    <pre
      class="audit-log-page-json"
      role="region"
      tabindex="0"
      data-scroll-region
      [attr.aria-label]="'audit.before' | t"
      >{{ $before() || '-' }}</pre>
  </section>
  <section>
    <h3>{{ 'audit.after' | t }}</h3>
    <pre
      class="audit-log-page-json"
      role="region"
      tabindex="0"
      data-scroll-region
      [attr.aria-label]="'audit.after' | t"
      >{{ $after() || '-' }}</pre>
  </section>
</app-dialog>
