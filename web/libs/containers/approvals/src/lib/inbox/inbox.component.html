<app-page-header [heading]="'approvals.title' | t" />

<app-tabs
  [label]="'approvals.title' | t"
  panel="approvals-panel"
  [tabs]="$tabs()"
  [active]="$tab()"
  (activeChange)="onTabChange($event)"
/>

<app-table
  appTabPanel="approvals-panel"
  [labelledByTab]="$tab()"
  [columns]="$columns()"
  [rows]="$rows()"
  [caption]="'approvals.title' | t"
  [loading]="$isLoading()"
  [failed]="$failed()"
  [rowLink]="rowLink"
  (retried)="onRetry()"
>
  <ng-template appCell="flags" let-row>
    @if (row.document.requiresOverride) {
      <app-status-chip flag="danger" [label]="'doc.flag.override' | t" />
    }
    @if (row.document.isLarge) {
      <app-status-chip flag="info" [label]="'doc.flag.large' | t" />
    }
  </ng-template>
  <ng-template appCell="qty" let-row>{{ row.document.totalQty | appQty }}</ng-template>
  <!-- The value that decides whether approval is needed; an unposted issue is an estimate at average cost (PS-03). -->
  <ng-template appCell="amount" let-row>
    {{ row.document.totalAmount | appMoney }}
    @if (row.document.amountIsEstimate) {
      <span class="approvals-inbox-estimate">{{ 'doc.estimate' | t }}</span>
    }
  </ng-template>
  <app-empty-state
    empty
    icon="check-double"
    [message]="($isWaitingTab() ? 'approvals.emptyWaiting' : 'approvals.emptyMine') | t"
  />
</app-table>
