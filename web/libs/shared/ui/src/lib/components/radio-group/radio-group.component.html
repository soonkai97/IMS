<fieldset
  class="ui-radio-group-set"
  [disabled]="$disabled()"
  [attr.aria-invalid]="$invalid() || null"
  [attr.aria-describedby]="$invalid() ? $errorId() : null"
>
  <legend class="ui-radio-group-legend">
    {{ $legend() }}
    @if ($required()) {
      <span class="ui-radio-group-required">({{ $requiredText() }})</span>
    }
  </legend>
  <div class="ui-radio-group-options">
    @for (item of $items(); track item.value) {
      <label class="ui-radio-group-option" [class.--checked]="item.checked">
        <input
          class="ui-radio-group-input"
          type="radio"
          [name]="groupName"
          [value]="item.value"
          [checked]="item.checked"
          (change)="onSelect(item.value)"
        />
        <span>{{ item.label }}</span>
      </label>
    }
  </div>
</fieldset>
