<fieldset
  class="ui-radio-group-set"
  [disabled]="$disabled()"
  [attr.aria-invalid]="$invalid() || null"
  [attr.aria-describedby]="$invalid() ? $errorId() : null"
>
  <legend class="ui-radio-group-legend" [class.--hidden]="$hideLegend()">
    @if ($required()) {
      {{ $legend() }}&nbsp;<span class="ui-radio-group-asterisk" aria-hidden="true">*</span
      ><span class="ui-radio-group-sr">{{ $requiredText() }}</span>
    } @else {
      {{ $legend() }}
    }
  </legend>
  <div class="ui-radio-group-options" [class.--segmented]="$segmented()">
    @for (item of $items(); track item.value) {
      <label
        class="ui-radio-group-option"
        [class.--checked]="item.checked"
        [class.--segmented]="$segmented()"
      >
        <input
          class="ui-radio-group-input"
          type="radio"
          [class.--segmented]="$segmented()"
          [name]="groupName"
          [value]="item.value"
          [checked]="item.checked"
          (change)="onSelect(item.value)"
        />
        <span [attr.lang]="item.lang">{{ item.label }}</span>
      </label>
    }
  </div>
</fieldset>
