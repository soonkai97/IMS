<label class="ui-checkbox-row">
  <input
    class="ui-checkbox-control"
    type="checkbox"
    [checked]="$checked()"
    [disabled]="$disabled()"
    [attr.aria-describedby]="$describedBy() ?? null"
    (change)="onToggle($event)"
    (blur)="onBlur()"
  />
  <span class="ui-checkbox-label"><ng-content /></span>
</label>
