<app-dialog [open]="$open()" [heading]="$heading()" (openChange)="onOpenChange($event)">
  @if ($body()) {
    <p class="ui-confirm-dialog-body">{{ $body() }}</p>
  }
  @if ($hasReason()) {
    @if ($reasonRequired()) {
      <app-form-legend />
    }
    <app-form-field
      [label]="$reasonLabel() ?? ''"
      [required]="$reasonRequired()"
      [control]="reason"
      [messages]="$reasonMessages()"
    >
      <app-textarea [formControl]="reason" [rows]="3" focusOnOpen />
    </app-form-field>
  }
  <div dialogActions class="ui-confirm-dialog-actions">
    @if ($alternateLabel(); as alternate) {
      <app-button (clicked)="onAlternate()">{{ alternate }}</app-button>
    } @else {
      <app-button (clicked)="onCancel()">{{ $cancelLabel() }}</app-button>
    }
    <app-button [variant]="$confirmVariant()" [loading]="$busy()" (clicked)="onConfirm()">
      {{ $confirmLabel() }}
    </app-button>
  </div>
</app-dialog>
