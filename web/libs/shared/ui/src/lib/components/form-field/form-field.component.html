<label
  class="ui-form-field-label"
  [class.sr-only]="$labelHidden()"
  [attr.id]="labelId"
  [attr.for]="inputId"
>
  @if ($required()) {
    {{ $label() }}&nbsp;<span class="ui-form-field-asterisk" aria-hidden="true">*</span>
  } @else {
    {{ $label() }}
  }
</label>
<ng-content />
@if ($hint(); as hint) {
  <p class="ui-form-field-hint" [id]="hintId">{{ hint }}</p>
}
<div class="ui-form-field-live" aria-live="polite">
  @if ($errorText(); as errorText) {
    <p class="ui-form-field-error" [id]="errorId">
      <app-icon class="ui-form-field-error-icon" name="alert" [size]="16" />
      <span>{{ errorText }}</span>
    </p>
  }
</div>
