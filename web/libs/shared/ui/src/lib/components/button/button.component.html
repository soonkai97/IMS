<button
  #control
  class="ui-button-control"
  [class.--saved]="$showSaved()"
  [attr.type]="$type()"
  [disabled]="$isNativeDisabled()"
  [attr.aria-disabled]="$isAriaDisabled() || null"
  [attr.aria-describedby]="$describedBy()"
  [attr.aria-busy]="$loading()"
  [attr.aria-label]="$ariaLabel()"
  [attr.aria-expanded]="$expanded()"
  [attr.aria-controls]="$controls()"
  [attr.aria-haspopup]="$popup()"
  [style.min-width.px]="$lockedWidth()"
  [style.max-width.px]="$lockedWidth()"
  (click)="onClick($event)"
>
  <span class="ui-button-face" [class.--busy]="$spinnerVisible()" [class.--covered]="$showSaved()">
    @if ($spinnerVisible()) {
      <app-spinner />
    }
    <span class="ui-button-icon"><ng-content select="app-icon" /></span>
    <ng-content />
  </span>
  @if ($showSaved()) {
    <span class="ui-button-saved">
      <app-icon name="check" [size]="20" />
      {{ $savedText() }}
    </span>
  }
</button>
