name: Deploy

# Manual deployment of an image built by the Release workflow to the one small VM (Docker Compose + Caddy; owner decision 2026-11-13, docs/architecture/deployment.md).
# It SSHes to the VM and runs deploy/scripts/deploy.sh there. Migrations are never run by this workflow: deploy.sh stops and prints the DBA script command
# unless the run says the schema is already migrated (input "migrated").
#
# MANDATORY setup (Settings > Environments > production), see deploy/README.md:
#   - Required reviewers: the people who approve each deploy.
#   - Deployment branches and tags: "Selected branches and tags", add only `main`. Without it a branch that carries a changed workflow or script could run
#     with the environment's secrets. This workflow also refuses to run from any ref but main, and refuses an image whose commit is not on main.
#   secrets:   DEPLOY_HOST (VM address), DEPLOY_USER (login that owns the compose directory and can run docker),
#              DEPLOY_SSH_KEY (private key of a key pair used only for this), DEPLOY_KNOWN_HOSTS (the output of `ssh-keyscan -t ed25519 <host>`, checked against the fingerprint the owner reads on the VM)
#   variables: DOMAIN (optional: the public name; when set the runner runs the smoke check against https://DOMAIN after the deploy),
#              DEPLOY_PATH (optional, default /opt/ims: the repository checkout on the VM)
# The application secrets (database password, JWT key, admin password) are NOT GitHub secrets: they live in deploy/.env.prod on the VM (chmod 600).
# While the secrets are absent the run stops at the first step with the list of what is missing.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (one VM, so production)
        type: choice
        options: [production]
        default: production
      image_tag:
        description: Image tag to deploy, sha-<7 to 40 hex digits> of a commit on main (for example sha-1a2b3c4)
        required: true
      migrated:
        description: The schema is already migrated for this tag (the DBA script has been run); leave off to pull and print the migration command only
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 20
    env:
      OWNER: ${{ github.repository_owner }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      MIGRATED: ${{ inputs.migrated }}
    steps:
      - name: Only from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error title=Not main::Deploy runs only from main (this run is on $GITHUB_REF): the scripts that reach the VM must be reviewed ones."
            exit 1
          fi

      - name: Check the deploy secrets are configured
        # Secrets go through env, never interpolated into the script text. A missing secret is an empty string.
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -n "$DEPLOY_HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$DEPLOY_USER" ] || missing="$missing DEPLOY_USER"
          [ -n "$DEPLOY_SSH_KEY" ] || missing="$missing DEPLOY_SSH_KEY"
          [ -n "$DEPLOY_KNOWN_HOSTS" ] || missing="$missing DEPLOY_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error title=Secrets not configured::Secrets not configured in the '${{ inputs.environment }}' environment:$missing. See docs/architecture/deployment.md (what the owner must provide)."
            exit 1
          fi

      - name: Check the image tag
        run: |
          case "$IMAGE_TAG" in
            sha-*[!0-9a-f]*|sha-) echo "::error::The image tag must be sha- followed by 7 to 40 lower-case hex digits: '$IMAGE_TAG'"; exit 1 ;;
            sha-*) ;;
            *) echo "::error::The image tag must be sha- followed by 7 to 40 lower-case hex digits: '$IMAGE_TAG'"; exit 1 ;;
          esac
          hex=${IMAGE_TAG#sha-}
          if [ "${#hex}" -lt 7 ] || [ "${#hex}" -gt 40 ]; then
            echo "::error::The image tag must be sha- followed by 7 to 40 lower-case hex digits: '$IMAGE_TAG'"; exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: The image's commit must be on main
        id: commit
        run: |
          hex=${IMAGE_TAG#sha-}
          full=$(git rev-parse --verify --quiet "${hex}^{commit}") || { echo "::error::No commit $hex in this repository."; exit 1; }
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$full" origin/main; then
            echo "::error title=Not on main::Commit $full is not an ancestor of main: only reviewed, merged commits are deployed."
            exit 1
          fi
          echo "sha=$full" >> "$GITHUB_OUTPUT"

      - name: Verify both images exist
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          docker manifest inspect "ghcr.io/$OWNER/ims-api:$IMAGE_TAG" > /dev/null
          docker manifest inspect "ghcr.io/$OWNER/ims-web:$IMAGE_TAG" > /dev/null

      - name: Prepare SSH (pinned host key, no trust on first use)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/id"
          chmod 600 "$RUNNER_TEMP/ssh/id"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"

      - name: Deploy on the VM
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/ims' }}
          IMAGE_SHA: ${{ steps.commit.outputs.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          flags="--tag $IMAGE_TAG"
          [ "$MIGRATED" = "true" ] && flags="$flags --migrated"
          # The VM runs the scripts of the image's own commit, which is on main (checked above), never an unreviewed one.
          # The registry token goes over the SSH connection's stdin, not into the command line or a file.
          set +e
          printf '%s' "$GHCR_TOKEN" | ssh -i "$RUNNER_TEMP/ssh/id" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" "export GHCR_TOKEN=\$(cat) GHCR_USER='$GHCR_USER'; cd '$DEPLOY_PATH' && git fetch --quiet origin main && git checkout --quiet --detach '$IMAGE_SHA' && deploy/scripts/deploy.sh $flags"
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "::warning title=Migration needed::Images pulled, nothing restarted. Run the migration script on the VM, then run this workflow again with 'migrated' ticked."
            exit 0
          fi
          exit "$code"

      - name: Smoke check from outside (public name)
        if: ${{ vars.DOMAIN != '' && inputs.migrated }}
        env:
          SMOKE_BASE_URL: https://${{ vars.DOMAIN }}
        run: deploy/scripts/smoke.sh

      - name: Clean up the SSH material
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"
