name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Throwaway credentials for the CI-only SQL Server container. Not secrets: the container lives for this job only.
  CI_DB_PASSWORD: "Ci-Only#Passw0rd-2026"

jobs:
  api:
    name: API (build, unit, architecture, integration, smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ env.CI_DB_PASSWORD }}
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Ims.sln

      - name: Build production code (warnings as errors)
        run: dotnet build src/Ims.Api/Ims.Api.csproj -c Release --no-restore -warnaserror

      - name: Build everything (tests included)
        run: dotnet build Ims.sln -c Release --no-restore

      - name: Unit + architecture tests
        run: >
          dotnet test Ims.sln -c Release --no-build
          --filter "FullyQualifiedName!~Ims.Api.Tests"
          --logger "trx;LogFileName=unit.trx" --results-directory TestResults

      - name: Integration tests (real SQL Server)
        if: hashFiles('tests/Ims.Api.Tests/**/*.cs') != ''
        env:
          IMS_TEST_DB: "Server=localhost,1433;Database=Ims_CI_Tests;User Id=sa;Password=${{ env.CI_DB_PASSWORD }};TrustServerCertificate=True"
        run: >
          dotnet test tests/Ims.Api.Tests -c Release --no-build
          --logger "trx;LogFileName=integration.trx" --results-directory TestResults

      - name: Start API for the smoke test
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5109
          ConnectionStrings__Default: "Server=localhost,1433;Database=Ims_CI_Smoke;User Id=sa;Password=${{ env.CI_DB_PASSWORD }};TrustServerCertificate=True"
          Seed__AdminPassword: "Ci-Admin#2026"
          Seed__DemoPassword: "Ci-Demo#2026"
        run: |
          # The content root is the working directory, so start from the build output where appsettings*.json were copied.
          (cd src/Ims.Api/bin/Release/net10.0 && nohup dotnet Ims.Api.dll > "$GITHUB_WORKSPACE/api.log" 2>&1 &)
          for i in $(seq 1 40); do
            curl -fsS http://localhost:5109/health && exit 0
            sleep 2
          done
          echo "API did not become healthy"; cat api.log; exit 1

      - name: End-to-end API smoke test
        env:
          IMS_URL: http://localhost:5109
          IMS_ADMIN_PASSWORD: "Ci-Admin#2026"
          IMS_DEMO_PASSWORD: "Ci-Demo#2026"
        run: node tests/smoke/smoke.mjs

      - name: Fail on unexpected server errors in the API log
        run: |
          if grep -E " ERR\]" api.log; then echo "API logged errors"; exit 1; fi

      - name: Upload test results and API log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: api-test-results
          path: |
            TestResults/
            api.log
          if-no-files-found: ignore

  web:
    name: Web (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - name: Detect web project
        id: web
        working-directory: .
        run: echo "present=$([ -f web/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.web.outputs.present == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        if: steps.web.outputs.present == 'true'
      - name: Lint (eslint + stylelint)
        if: steps.web.outputs.present == 'true'
        run: npm run lint
      - name: Format check
        if: steps.web.outputs.present == 'true'
        run: npm run format:check
      - name: Unit tests (jest)
        if: steps.web.outputs.present == 'true'
        run: npm test
      - name: Colour contrast check
        if: steps.web.outputs.present == 'true'
        run: npm run contrast
      - name: Production build
        if: steps.web.outputs.present == 'true'
        run: npm run build:prod
      - uses: actions/upload-artifact@v6
        if: steps.web.outputs.present == 'true'
        with:
          name: web-dist
          path: web/dist/main/browser
          if-no-files-found: error

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: NuGet vulnerabilities
        run: |
          dotnet restore Ims.sln
          dotnet list Ims.sln package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then echo "Vulnerable packages found"; exit 1; fi
      - uses: actions/setup-node@v7
        if: ${{ hashFiles('web/package-lock.json') != '' }}
        with:
          node-version: 20
      - name: npm vulnerabilities (production dependencies, high and above)
        if: ${{ hashFiles('web/package-lock.json') != '' }}
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
